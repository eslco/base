# 必读！！！
# 注意规则在满足自己需求情况下，尽量做到精简，不要过度复杂，以免影响性能。
# 跑裸核用户请自行去掉下方控制面板模块的注释。
# 机场订阅
proxy-providers:
  Airport1:
    url: "https://esub.doh.dpdns.org/sub?token=aes"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: Direct

# 节点信息
proxies:
  - { name: Direct, type: direct }
  - { name: Reject, type: reject }
# 全局配置
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
# interface-name: enp6s18
log-level: warning
find-process-mode: "off"
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true

# 控制面板
external-controller: "0.0.0.0:9090"
secret: ""
external-ui: ui
external-ui-name: zash
external-ui-url: "https://gh.xmly.dev/github.com/Zephyruso/zashboard/archive/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"

# 入站
tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private_domain,cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.market.xiaomi.com"
  default-nameserver:
    - 8.8.4.4
    - 1.0.0.1
  proxy-server-nameserver:
    - https://223.6.6.6/dns-query
  # namesever尽量用运营商提供的DNS
  nameserver:
    - 223.6.6.6
    - 119.28.28.28

# 出站策略
# 注意锚点必须放在引用的上方，可以集中把锚点全部放yaml的顶部。
pr:
  &pr {
    type: select,
    proxies:
      [
        🚀 Proxy,
        🔯 HK.bak,
        🔯 JP.bak,
        ♻️ HK Auto,
        ♻️ JP Auto,
        ♻️ US Auto,
        ♻️ Auto,
        🇦🇺 AU,
        🇬🇧 GB,
        🇭🇰 HK,
        🇯🇵 JP,
        🇺🇸 US,
        🌐 Manual,
        Direct,
      ],
  }
proxy-groups:
  - {
      name: 🚀 Proxy,
      type: select,
      proxies:
        [
          🌐 Manual,
          🔯 HK.bak,
          🔯 JP.bak,
          ♻️ HK Auto,
          ♻️ JP Auto,
          ♻️ US Auto,
          ♻️ Auto,
          🇦🇺 AU,
          🇬🇧 GB,
          🇭🇰 HK,
          🇯🇵 JP,
          🇺🇸 US,
          Direct,
        ],
    }
  - { name: 🌐 Manual, type: select, include-all: true }
  - { name: 📹 YouTube, <<: *pr }
  - { name: 🍀 Google, <<: *pr }
  - { name: 🤖 ChatGPT, <<: *pr }
  - { name: 👨🏿‍💻 GitHub, <<: *pr }
  - { name: 🐬 OneDrive, <<: *pr }
  - { name: 🪟 Microsoft, <<: *pr }
  - { name: 🎵 TikTok, <<: *pr }
  - { name: 📲 Telegram, <<: *pr }
  - { name: 🎥 NETFLIX, <<: *pr }
  - { name: ✈️ Speedtest, <<: *pr }
  - { name: 💶 PayPal, <<: *pr }
  - { name: 🍎 Apple, type: select, proxies: [Direct, 🚀 Proxy] }
  - { name: 🎯 DirectN, type: select, proxies: [Direct, 🚀 Proxy, 🌐 Manual] }
  - { name: 🐟 Final, <<: *pr }
  - {
      name: 🇦🇺 AU,
      type: select,
      include-all: true,
      filter: "🇦🇺|aus|Aus|澳|悉尼|墨尔本|布里斯班|堪培拉|珀斯|阿德莱德|Darwin|Sydney|Melbourne|Brisbane|Canberra|Perth|Adelaide|DRW|SYD|MEL|BNE|CBR|PER|ADL",
    }
  - {
      name: 🇬🇧 GB,
      type: select,
      include-all: true,
      filter: "(?i)🇬🇧|GB|UK|Britain|英国|伦敦|曼彻斯特|伯明翰|利兹|London|Manchester|Birmingham|Leeds|LON|MAN|BHX|LBA",
    }
  # - {name: 🇨🇦 CA, type: select, include-all: true, filter: "(?i)🇨🇦|CA|Canada|加拿大|多伦多|温哥华|渥太华|蒙特利尔|Calgary|Toronto|Vancouver|Ottawa|Montreal|CAL|YTO|YVR|YOW|YUL"}
  - {
      name: 🇭🇰 HK,
      type: select,
      include-all: true,
      filter: "(?i)港|hk|hongkong|hong kong",
    }
  - { name: 🇯🇵 JP, type: select, include-all: true, filter: "(?i)日|jp|japan" }
  - {
      name: 🇺🇸 US,
      type: select,
      include-all: true,
      filter: "(?i)美|us|unitedstates|united states",
    }
  - {
      name: 🔯 HK.bak,
      type: fallback,
      include-all: true,
      tolerance: 20,
      interval: 300,
      filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$",
    }
  - {
      name: 🔯 JP.bak,
      type: fallback,
      include-all: true,
      tolerance: 20,
      interval: 300,
      filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$",
    }
  - {
      name: ♻️ HK Auto,
      type: url-test,
      include-all: true,
      tolerance: 20,
      interval: 300,
      filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$",
    }
  - {
      name: ♻️ JP Auto,
      type: url-test,
      include-all: true,
      tolerance: 20,
      interval: 300,
      filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$",
    }
  - {
      name: ♻️ US Auto,
      type: url-test,
      include-all: true,
      tolerance: 20,
      interval: 300,
      filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$",
    }
  - {
      name: ♻️ Auto,
      type: url-test,
      include-all: true,
      tolerance: 20,
      interval: 300,
      filter: "^((?!(Direct)).)*$",
    }

# 规则匹配
# 此规则部分没有做防泄露处理，因为弊严重大于利！
rules:
  - DOMAIN-SUFFIX,qichiyu.com,🚀 Proxy
  - RULE-SET,apple_domain,🍎 Apple
  - RULE-SET,proxylite,🚀 Proxy
  - RULE-SET,ai,🤖 ChatGPT
  - RULE-SET,github_domain,👨🏿‍💻 GitHub
  - RULE-SET,youtube_domain,📹 YouTube
  - RULE-SET,google_domain,🍀 Google
  - RULE-SET,onedrive_domain,🐬 OneDrive
  - RULE-SET,microsoft_domain,🪟 Microsoft
  - RULE-SET,tiktok_domain,🎵 TikTok
  - RULE-SET,speedtest_domain,✈️ Speedtest
  - RULE-SET,telegram_domain,📲 Telegram
  - RULE-SET,netflix_domain,🎥 NETFLIX
  - RULE-SET,paypal_domain,💶 PayPal
  - RULE-SET,gfw_domain,🚀 Proxy
  - RULE-SET,geolocation-!cn,🚀 Proxy
  - RULE-SET,cn_domain,🎯 DirectN
  - RULE-SET,google_ip,🍀 Google,no-resolve
  - RULE-SET,netflix_ip,🎥 NETFLIX,no-resolve
  - RULE-SET,apple_ip,🍎 Apple,no-resolve
  - RULE-SET,telegram_ip,📲 Telegram,no-resolve
  - RULE-SET,private_domain,Direct
  - RULE-SET,private_ip,Direct,no-resolve
  - RULE-SET,cn_ip,🎯 DirectN
  - MATCH,🐟 Final

# 规则集
